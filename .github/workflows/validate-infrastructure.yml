name: Validate staging infrastructure

on:
  pull_request:
    paths:
      - Dockerfile
      - Caddyfile.staging
      - docker-compose.staging.yml
      - .dockerignore
      - .env.staging.example
      - scripts/**
      - .github/workflows/deploy-staging.yml
      - .github/workflows/validate-infrastructure.yml
      - next.config.ts
      - package.json
      - package-lock.json
      - prisma/**
      - src/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    name: Docker and Compose
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate shell scripts
        run: |
          bash -n \
            scripts/deploy-staging.sh \
            scripts/backup-staging.sh \
            scripts/restore-staging.sh \
            scripts/health-check-staging.sh
          shellcheck \
            scripts/deploy-staging.sh \
            scripts/backup-staging.sh \
            scripts/restore-staging.sh \
            scripts/health-check-staging.sh

      - name: Validate Compose configuration
        run: |
          APP_COMMIT_SHA="${RELEASE_SHA}" docker compose \
            --env-file .env.staging.example \
            -f docker-compose.staging.yml \
            config --quiet

      - name: Validate Caddy configuration
        run: |
          docker run --rm \
            -e STAGING_DOMAIN=alpha.example.com \
            -e CADDY_EMAIL=ops@example.com \
            -v "${PWD}/Caddyfile.staging:/etc/caddy/Caddyfile:ro" \
            caddy:2.10-alpine \
            caddy validate --config /etc/caddy/Caddyfile

      - name: Build application image
        run: |
          docker build \
            --target runner \
            --build-arg APP_COMMIT_SHA="${RELEASE_SHA}" \
            --tag fleetpilot-staging-app:"${RELEASE_SHA}" \
            .

      - name: Build migrator image
        run: |
          docker build \
            --target migrator \
            --build-arg APP_COMMIT_SHA="${RELEASE_SHA}" \
            --tag fleetpilot-staging-migrate:"${RELEASE_SHA}" \
            .

      - name: Exercise migration and health flow
        run: |
          export APP_COMMIT_SHA="${RELEASE_SHA}"
          compose=(docker compose --env-file .env.staging.example -f docker-compose.staging.yml)
          "${compose[@]}" up -d db storage-init
          "${compose[@]}" --profile release run --rm migrate
          "${compose[@]}" up -d app
          for attempt in {1..30}; do
            if "${compose[@]}" exec -T app node -e \
              "fetch('http://127.0.0.1:3000/api/health').then(async r=>{const b=await r.json();if(!r.ok||b.commit!=='${RELEASE_SHA}')process.exit(1)}).catch(()=>process.exit(1))"; then
              exit 0
            fi
            sleep 2
          done
          "${compose[@]}" logs app db
          exit 1

      - name: Clean validation containers
        if: always()
        run: |
          APP_COMMIT_SHA="${RELEASE_SHA}" docker compose \
            --env-file .env.staging.example \
            -f docker-compose.staging.yml \
            --profile release down --volumes
