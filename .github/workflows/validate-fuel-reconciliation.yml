name: Validate fuel reconciliation

on:
  pull_request:
    paths:
      - 'prisma/**'
      - 'src/lib/finance/fuel-deduction-reconciliation*'
      - 'src/app/api/finance/fuel-reconciliation/**'
      - 'src/components/accounting/**'
      - 'src/components/fleet/TruckOwnerHistory.tsx'
      - 'src/lib/fleet/truck-owner*'
      - 'src/lib/fleet/fuel-owner-attribution-ui.test.ts'
      - 'src/app/api/trucks/**/owner-history/**'
      - 'src/app/trucks/page.tsx'
      - 'tests/ui/truck-owner-history.spec.ts'
      - 'tests/ui/accounting-workspace.spec.ts'
      - '.github/workflows/validate-fuel-reconciliation.yml'
  workflow_dispatch:

jobs:
  exact-head:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.5-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fleetpilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fleetpilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/fleetpilot?schema=public
      AUTH_SECRET: fleetpilot-ci-only-not-production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma format --check
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - name: Verify trusted test temporary ancestry
        run: |
          node <<'NODE'
          const { lstatSync } = require('node:fs');
          const { tmpdir } = require('node:os');
          const path = require('node:path');
          const selected = process.env.RUNNER_TEMP;
          if (!selected || !path.isAbsolute(selected)) throw new Error('RUNNER_TEMP must be an existing absolute directory.');
          function inspect(label, directory, enforce) {
            const ancestry = [];
            for (let current = path.resolve(directory);; current = path.dirname(current)) {
              ancestry.push(current);
              if (current === path.dirname(current)) break;
            }
            for (const directory of ancestry.reverse()) {
              let stat;
              try { stat = lstatSync(directory); }
              catch (error) {
                console.log(JSON.stringify({ label, directory, error: error.code }));
                if (enforce) throw error;
                continue;
              }
              console.log(JSON.stringify({ label, directory, uid: stat.uid, mode: (stat.mode & 0o7777).toString(8), type: stat.isDirectory() ? 'directory' : 'other', symlink: stat.isSymbolicLink() }));
              if (enforce && (!stat.isDirectory() || stat.isSymbolicLink() || (stat.mode & 0o022) !== 0 || (stat.uid !== 0 && stat.uid !== process.getuid?.()))) throw new Error('RUNNER_TEMP ancestry is not trusted.');
            }
          }
          inspect('default os.tmpdir()', tmpdir(), false);
          inspect('selected RUNNER_TEMP', selected, true);
          NODE
      - run: npm test
        env:
          TMPDIR: ${{ runner.temp }}
      - run: npx tsc --noEmit
      - run: npx eslint src/lib/finance/fuel-deduction-reconciliation.ts src/lib/finance/fuel-deduction-reconciliation.test.ts src/app/api/finance/fuel-reconciliation/route.ts src/components/accounting/FuelReconciliationWorkspace.tsx src/components/accounting/StatementArchiveWorkspace.tsx src/components/accounting/AccountingWorkspace.tsx src/components/accounting/FuelOwnerAttribution.tsx src/components/fleet/TruckOwnerHistory.tsx src/lib/fleet/truck-owner-editor.ts src/lib/fleet/truck-owner-editor.test.ts src/lib/fleet/fuel-owner-attribution-ui.test.ts src/lib/fleet/truck-owner-history.ts src/app/api/trucks/\[id\]/owner-history/options/route.ts src/app/trucks/page.tsx tests/ui/accounting-workspace.spec.ts tests/ui/truck-owner-history.spec.ts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/ui/accounting-workspace.spec.ts tests/ui/truck-owner-history.spec.ts
