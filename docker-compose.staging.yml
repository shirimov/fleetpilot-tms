name: ${COMPOSE_PROJECT_NAME:-fleetpilot-staging}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

x-app-environment: &app-environment
  NODE_ENV: production
  APP_COMMIT_SHA: ${APP_COMMIT_SHA:?Set APP_COMMIT_SHA to an exact Git commit}
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
  AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET}
  AUTH_GITHUB_ID: ${AUTH_GITHUB_ID:?Set AUTH_GITHUB_ID}
  AUTH_GITHUB_SECRET: ${AUTH_GITHUB_SECRET:?Set AUTH_GITHUB_SECRET}
  AUTH_URL: ${APP_URL:?Set APP_URL}
  AUTH_TRUST_HOST: "true"
  EMAIL_AUTH_ENABLED: ${EMAIL_AUTH_ENABLED:-false}
  EMAIL_AUTH_RESEND_API_KEY: ${EMAIL_AUTH_RESEND_API_KEY:-}
  EMAIL_AUTH_FROM: ${EMAIL_AUTH_FROM:-}
  TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
  TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
  QUICKMANAGE_CLIENT_ID: ${QUICKMANAGE_CLIENT_ID:-}
  QUICKMANAGE_CLIENT_SECRET: ${QUICKMANAGE_CLIENT_SECRET:-}
  QUICKMANAGE_API_BASE_URL: ${QUICKMANAGE_API_BASE_URL:-https://api.quickmanage.com}
  PLAID_CLIENT_ID: ${PLAID_CLIENT_ID:-}
  PLAID_SECRET: ${PLAID_SECRET:-}
  PLAID_ENV: ${PLAID_ENV:-sandbox}
  BANK_TOKEN_ENCRYPTION_KEY: ${BANK_TOKEN_ENCRYPTION_KEY:-}
  PRIVATE_FILE_STORAGE_ROOT: ${PRIVATE_FILE_STORAGE_ROOT:-/var/lib/fleetpilot/private}

services:
  db:
    image: postgres:17.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  storage-init:
    image: alpine:3.22
    command: ["sh", "-c", "mkdir -p /private/task-attachments /private/dispatch-documents && chown -R 1001:1001 /private && chmod 0700 /private /private/task-attachments /private/dispatch-documents"]
    volumes:
      - private_files:/private
    restart: "no"
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  app:
    image: ${FLEETPILOT_IMAGE_REPOSITORY:-fleetpilot-staging}-app:${APP_COMMIT_SHA:?Set APP_COMMIT_SHA}
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        APP_COMMIT_SHA: ${APP_COMMIT_SHA:?Set APP_COMMIT_SHA}
    restart: unless-stopped
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    volumes:
      - private_files:${PRIVATE_FILE_STORAGE_ROOT:-/var/lib/fleetpilot/private}
    networks:
      - frontend
      - backend
    expose:
      - "3000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *default-logging

  migrate:
    profiles: ["release"]
    image: ${FLEETPILOT_IMAGE_REPOSITORY:-fleetpilot-staging}-migrate:${APP_COMMIT_SHA:?Set APP_COMMIT_SHA}
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
      args:
        APP_COMMIT_SHA: ${APP_COMMIT_SHA:?Set APP_COMMIT_SHA}
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-}
      BOOTSTRAP_COMPANY_NAME: ${BOOTSTRAP_COMPANY_NAME:-}
      BOOTSTRAP_CONFIRM: ${BOOTSTRAP_CONFIRM:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"
    logging: *default-logging

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      STAGING_DOMAIN: ${STAGING_DOMAIN:?Set STAGING_DOMAIN}
      CADDY_EMAIL: ${CADDY_EMAIL:?Set CADDY_EMAIL}
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile.staging:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - frontend
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    logging: *default-logging

volumes:
  postgres_data:
  private_files:
  caddy_data:
  caddy_config:

networks:
  frontend:
  backend:
    internal: true
